name: Escalation override report
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  pull_request:
    paths: ['scripts/escalation_override_report.py', 'test_escalation_override_report.py', '.github/workflows/escalation-override-report.yml']
  push:
    branches: [main]
    paths: ['scripts/escalation_override_report.py', 'test_escalation_override_report.py', '.github/workflows/escalation-override-report.yml']
permissions:
  contents: read
concurrency:
  group: escalation-override-report-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - run: python3 -m unittest test_escalation_override_report.py
  report:
    needs: test
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.ESCALATION_REPORT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Report merges over an escalation
        env:
          # Needs pull-requests read and write on every reviewed repo (the report mark is a label).
          GH_TOKEN: ${{ secrets.ESCALATION_REPORT_GITHUB_TOKEN || secrets.STALE_SWEEP_GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DANIEL_CHAT_ID: ${{ secrets.TELEGRAM_DANIEL_CHAT_ID }}
        run: python3 scripts/escalation_override_report.py
        # This repository is public. The script prints counts and failure classes only, never a title or a message.
