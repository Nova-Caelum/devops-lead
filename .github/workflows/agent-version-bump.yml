name: Agent version bump

# REUSABLE WORKFLOW (source of truth). Nova-Caelum/_agentOS calls it on every push to main through a thin
# caller pinned to a full SHA (.github/workflows/agent-version-bump.yml there); the pin is the review gate
# for logic changes, never @main.
#
# It bumps agent_registry.agent_version by 1 (+0.01) for every agent whose loaded configuration the push
# touched (persona, skills, hooks, MCP config and helpers, settings, permissions; core paths bump the core
# group), through the ops verb bump_agent_versions, idempotent on agent-version-bump:<after-sha>. The
# mapping is read live from agent_registry; nothing here names an agent. See scripts/agent_version_bump.py.
#
# Execution context: under workflow_call everything resolves against the CALLER (_agentOS, private):
# github.token and the logs. The caller passes only the secrets declared below, by name; the registry read
# and the write both use the bump-only key AGENT_VERSION_BUMP_TOKEN (never the PR-review key). A
# workflow_dispatch here runs in this PUBLIC repository, so it is always a dry run and prints counts only.
# UNMAPPED paths warn AND go to Daniel's Telegram (one message per run).
#
# Runs are serialized (one concurrency group, queue: max) so no push's bump is dropped as a superseded
# pending run.

on:
  workflow_call:
    inputs:
      before:
        description: 'The push''s previous main head (github.event.before)'
        type: string
        required: true
      after:
        description: 'The push''s new main head (github.sha)'
        type: string
        required: true
    secrets:
      AGENT_VERSION_BUMP_TOKEN:
        description: 'Bump-only ops key (agent-version-bump-actions): list_agents, get_agent_info, bump_agent_versions'
        required: true
      TELEGRAM_BOT_TOKEN:
        description: 'DevOps-Lead bot: failure and UNMAPPED alerts'
        required: true
      TELEGRAM_DANIEL_CHAT_ID:
        required: true
      STALE_SWEEP_GITHUB_TOKEN:
        description: 'workflow_dispatch only (reads private _agentOS from this repo); callers do not pass it'
        required: false
  workflow_dispatch:
    inputs:
      before:
        description: '_agentOS commit before (full SHA). Dry run, counts only.'
        required: true
      after:
        description: '_agentOS commit after (full SHA)'
        required: true
  pull_request:
    paths: ['scripts/agent_version_bump.py', 'test_agent_version_bump.py', '.github/workflows/agent-version-bump.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve this workflow's own source
        # job.workflow_* (GitHub, 2026-09-03) name the repo and commit of THIS file, not the caller's.
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$WF_REPO" == */* && "$WF_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::job.workflow_repository/job.workflow_sha unavailable; refusing to run the caller's tree as this workflow's code"
            exit 1
          }
      # v6 = df4cb1c069e1874edd31b4311f1884172cec0e10 as of 2026-07-18
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - run: python3 -m unittest test_agent_version_bump.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'

  bump:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: agent-version-bump
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devops-lead
          persist-credentials: false
      - name: Check out _agentOS at the pushed commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: Nova-Caelum/_agentOS
          ref: ${{ inputs.after }}
          fetch-depth: 0
          path: .agentos
          # Under workflow_call the caller's github.token reads its own repo (the caller does not pass
          # STALE_SWEEP_GITHUB_TOKEN). Under workflow_dispatch here, the fine-grained token with Contents read does.
          token: ${{ secrets.STALE_SWEEP_GITHUB_TOKEN || github.token }}
          persist-credentials: false
      - name: Bump agent versions
        env:
          AGENT_VERSION_BUMP_TOKEN: ${{ secrets.AGENT_VERSION_BUMP_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DANIEL_CHAT_ID: ${{ secrets.TELEGRAM_DANIEL_CHAT_ID }}
          BEFORE: ${{ inputs.before }}
          AFTER: ${{ inputs.after }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          COUNTS_ONLY: ${{ github.event.repository.private != true }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          args=(--repo .agentos --before "$BEFORE" --after "$AFTER")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$COUNTS_ONLY" = "true" ] && args+=(--counts-only)
          python3 .devops-lead/scripts/agent_version_bump.py "${args[@]}"

  alert:
    needs: [test, bump]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devops-lead
          persist-credentials: false
      - name: Telegram alert (existing DevOps-Lead path)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DANIEL_CHAT_ID: ${{ secrets.TELEGRAM_DANIEL_CHAT_ID }}
          AFTER: ${{ inputs.after }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 .devops-lead/scripts/agent_version_bump.py --notify-failure --after "$AFTER" --run-url "$RUN_URL"
