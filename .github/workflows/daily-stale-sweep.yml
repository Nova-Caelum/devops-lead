name: Daily stale sweep
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['scripts/stale_sweep.py', 'scripts/stale_sweep_repos.json', 'test_stale_sweep.py', '.github/workflows/daily-stale-sweep.yml']
  push:
    branches: [main]
    paths: ['scripts/stale_sweep.py', 'scripts/stale_sweep_repos.json', 'test_stale_sweep.py', '.github/workflows/daily-stale-sweep.yml']
permissions:
  contents: read
concurrency:
  group: daily-stale-sweep-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - run: python3 -m unittest test_stale_sweep.py
  sweep:
    needs: test
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.STALE_SWEEP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Census and verified worklog delivery
        env:
          GH_TOKEN: ${{ secrets.STALE_SWEEP_GITHUB_TOKEN }}
          STALE_SWEEP_READ_TOKEN: ${{ secrets.STALE_SWEEP_READ_TOKEN }}
          OPS_SERVER_TOKEN: ${{ secrets.OPS_SERVER_TOKEN }}
        run: python3 scripts/stale_sweep.py --report "$RUNNER_TEMP/stale-report.json" --post
        # This repository is public. Internal reports must not be uploaded as artifacts or printed.
