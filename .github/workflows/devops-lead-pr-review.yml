name: DevOps-Lead PR Review (reusable)

# REUSABLE WORKFLOW — Option B source-of-truth/runtime split (2026-07-18).
# This repo (Highproofhero/devops-lead) is the SOURCE OF TRUTH for DevOps-Lead's
# PR-review logic. The ops repo (novacaelum-aaasops) carries only a thin stub
# that calls this workflow; the stub's pin (@SHA after probe passes) is the
# review gate for logic changes.
#
# Execution context: runs in the CALLER's context — github.* refs, secrets
# (via `secrets: inherit`), vars, and GITHUB_TOKEN all resolve against the
# calling repository (novacaelum-aaasops). Body below is byte-identical to
# ops-repo commit 7ec277c (unified Telegram template) except this trigger block.
#
# Change ceremony: edit here -> PR/review in THIS repo -> bump the pin in the
# ops-repo stub (one-line PR, human-reviewable in seconds; the deterministic
# steps escalate it loudly since it touches .github/workflows/).
#
# Historical header (v0.1 MVP lineage, known gaps) preserved in the ops repo's
# git history at 7ec277c and in workspace/devops-lead-buildout/ PRD notes.
#
# Auditor P0/P1 hardening (2026-07-18, Engineer subagent per
# Handoff_Engineer-AuditorP0P1-Hardening_2026-07-18.md): Telegram delivery
# verification (Task 1), worklog UUID verification (Task 2), dependency +
# model pinning (Task 3). See inline comments at each touched step.

on:
  workflow_call:

jobs:
  devops-lead-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout ops repo (PR head)
        # v6 = df4cb1c069e1874edd31b4311f1884172cec0e10 as of 2026-07-18
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1

      - name: Checkout canonical main (persona source — tamper-safe from PR head)
        # v6 = df4cb1c069e1874edd31b4311f1884172cec0e10 as of 2026-07-18
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main
          path: .canonical-main
          fetch-depth: 1

      - name: DevOps-Lead review
        id: review
        # v1 = 3553f84341b92da26052e28acf1aa898f9511f32 (v1.0.177) as of 2026-07-18
        uses: anthropics/claude-code-action@3553f84341b92da26052e28acf1aa898f9511f32
        env:
          DEVOPS_LEAD_PR_INPUT_TOKEN_CAP: ${{ vars.DEVOPS_LEAD_PR_INPUT_TOKEN_CAP || '50000' }}
          DEVOPS_LEAD_PR_OUTPUT_TOKEN_CAP: ${{ vars.DEVOPS_LEAD_PR_OUTPUT_TOKEN_CAP || '20000' }}
          DEVOPS_LEAD_MONTHLY_BUDGET_USD: ${{ vars.DEVOPS_LEAD_MONTHLY_BUDGET_USD || '10' }}
          OPS_SERVER_TOKEN: ${{ secrets.OPS_SERVER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DANIEL_CHAT_ID: ${{ secrets.TELEGRAM_DANIEL_CHAT_ID }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR AUTHOR: ${{ github.event.pull_request.user.login }}

            You are acting as DevOps-Lead (full persona instructions appended below via
            --append-system-prompt) reviewing a pull request against `novacaelum-aaasops`
            — the git-preservation mirror of the vault `_agentOS/` canonical layer
            (governance-evolution-sprint, 2026-07-17). This is v0.1 MVP: review, classify,
            comment, and merge-or-escalate. Tonight this workflow is being run as a live
            production-cycle demo — Daniel is watching one full cycle end-to-end.

            ## Task
            0. FIRST: Read `.canonical-main/_agentOS/agent_profiles/devops-lead/devops-lead.md`.
               That file IS your persona and operating instructions (DevOps-Lead). Adopt it
               fully before proceeding — it defines your review discipline, caps, and tone.
            1. Run `gh pr diff ${{ github.event.pull_request.number }}` to see the changed files.
            2. Classify the diff against this allowlist (adapted from PRD AD-5 for the
               ops-repo context, where the tracked content is `_agentOS/**` plus repo
               scaffolding):
               - AUTO-MERGE-SAFE: docs-only markdown, `README.md`, `.gitignore`,
                 `outputs/**`, `platform/**` (legacy PromptOps scaffold, not live).
               - ESCALATE (always, never auto-merge): `_agentOS/rules/**`,
                 `_agentOS/system/**`, `_agentOS/skills/**`,
                 `_agentOS/agent_profiles/**` (non-prose / frontmatter changes),
                 `.github/workflows/**`, any diff containing credential-shaped strings,
                 any diff you cannot confidently classify.
            3. Self-PR safety (PRD AD-8 / Q4): if PR AUTHOR looks like an automation/bot
               identity rather than a human GitHub user, do NOT auto-merge regardless of
               tier unless the PR carries a `human-approved` label. State this explicitly
               in your comment if it applies.
            4. Cost/safety caps: read `DEVOPS_LEAD_PR_INPUT_TOKEN_CAP` /
               `_OUTPUT_TOKEN_CAP` / `_MONTHLY_BUDGET_USD` from env and reason about them —
               these are NOT hard-metered by the job (see workflow file header comment);
               keep your own review proportionate to a small-diff maintenance PR.
            5. Post your verdict as a PR comment via `gh pr comment` — state the tier,
               your rationale, and whether you attempted a merge. Your comment MUST
               include, on its own line, `CHANGE-SUMMARY: <one sentence describing what
               this PR changes>`. If (and only if) this PR is ESCALATE tier, also include
               a line `ESCALATION-REASON: <one sentence on what Daniel needs to review and
               why it matters>`. A later deterministic workflow step parses these exact
               marker lines to build Daniel's Telegram notification — use the literal
               marker text verbatim, one sentence each, no markdown around the marker.
            6. If AUTO-MERGE-SAFE and not self-PR-blocked: run
               `gh pr merge ${{ github.event.pull_request.number }} --auto --squash`.
            7. If ESCALATE: apply the escalation label via
               `gh pr edit ${{ github.event.pull_request.number }} --add-label escalate-daniel`
               (create the label first with `gh label create` if it doesn't exist yet,
               ignore the error if it already does). Do NOT attempt any Telegram call or
               any other curl — a later workflow step sends the escalation notice
               automatically when it sees the `escalate-daniel` label. (2026-07-18: in-model
               secret-bearing curl is structurally impossible here — the Bash permission
               evaluator denies any command containing env-var expansion, "Contains
               simple_expansion". Stress-test evidence: PR #3, PR #4.)
            8. Worklog bookkeeping is AUTOMATED by a later workflow step — do not attempt
               to write the worklog yourself. Your job ends at: comment posted +
               merge-or-label executed.

            Never claim you merged a PR you did not actually run `gh pr merge` on. Never
            print secret values (or anything derived from them) to any comment, log line,
            or commit message.

          claude_args: |
            --model claude-sonnet-4-5-20250929
            --max-turns 35
            --allowedTools "Read,Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr merge:*),Bash(gh pr edit:*),Bash(gh pr view:*),Bash(gh label create:*),mcp__github_inline_comment__create_inline_comment"

      # Deterministic bookkeeping (2026-07-18): the model CANNOT do secret-bearing curl
      # (permission evaluator denies env-var expansion — "Contains simple_expansion";
      # stress-test evidence PR #3/#4). Worklog + escalation-Telegram therefore live in
      # workflow steps, where secrets work natively (same pattern as the failure-alert
      # step below). hook-secret-handling: -sS only, no -v, no set -x, tokens only in
      # header/URL args, responses field-filtered, vars unset after use.

      - name: Record review outcome (worklog — deterministic)
        # Worklog UUID verification (2026-07-18, auditor P1 hardening, scoped): a
        # bare non-error response (including `{}`) is NOT proof of a write. Success
        # now REQUIRES a parsed row UUID from `.result.content[0].text` (the MCP
        # tool-call response wraps its JSON payload as a string at that path — see
        # handoff evidence: ops-server MCP append_worklog returns
        # {"id": "<uuid>", "created_at": "..."} inside that string). No UUID = failure
        # path (existing worklog-write-failed label + WORKLOG_PENDING notice).
        #
        # Constraint (documented, not attempted): read-after-write verification is
        # IMPOSSIBLE with the current bearer — it is scoped to `append_worklog` only,
        # no read verbs. The returned UUID is the strongest available proof available
        # to this step. Bearer scope extension is a Daniel-gated revision-plan item.
        # Constraint 2 (documented, not attempted): the auditor's suggested
        # surface=`github-action` is not in the ops-server surface enum (would be
        # rejected); this step keeps `surface:"claude-cloud"`. Enum extension is a
        # server-side change, also a revision-plan item.
        if: always() && !cancelled()
        env:
          OPS_SERVER_TOKEN: ${{ secrets.OPS_SERVER_TOKEN }}
        run: |
          set -euo pipefail
          PR=${{ github.event.pull_request.number }}
          REPO_SLUG="${{ github.event.repository.name }}"
          IDEM_TAG="idem:${REPO_SLUG}-pr${PR}-${{ github.run_id }}"
          # Did Claude actually run? On workflow-change PRs the action self-skips
          # ("workflow validation") but the step still reports success — the
          # execution-output file is the discriminator (false-green detector).
          if [ -f /home/runner/work/_temp/claude-execution-output.json ]; then
            CLAUDE_STATE="ran"
          else
            CLAUDE_STATE="validation-skip (action never launched Claude — likely workflow-change PR)"
            # LAYER ONE (2026-07-18, Daniel-approved): the reviewer cannot review
            # changes to its own definition — the action skips the model on
            # workflow-change PRs, which previously looked like silent success.
            # Convert the silent skip into a loud escalation: label here; the
            # Telegram step below sends the escalation notice. The PR stays open
            # awaiting human review. No branches/PRs are ever auto-created.
            gh label create escalate-daniel --color FBCA04 2>/dev/null || true
            gh pr edit "$PR" --add-label escalate-daniel 2>/dev/null || true
          fi
          FACTS=$(gh pr view "$PR" --json state,mergedAt,labels \
            -q '"state=" + .state + " merged=" + (if .mergedAt then "yes" else "no" end) + " labels=" + ([.labels[].name] | join("+") | if . == "" then "none" else . end)' 2>/dev/null || echo "facts-unavailable")
          SUMMARY="PR #${PR} review run ${{ github.run_id }}: step=${{ steps.review.outcome }}, claude=${CLAUDE_STATE}, ${FACTS}"
          SUMMARY=$(printf '%s' "$SUMMARY" | head -c 279)
          PAYLOAD=$(jq -n --arg s "$SUMMARY" --arg idem "$IDEM_TAG" '{jsonrpc:"2.0",id:1,method:"tools/call",params:{name:"append_worklog",arguments:{author:"devops-lead",project:"governance-evolution-sprint",summary:$s,surface:"claude-cloud",tags:["vault-pr","pr-review","deterministic-bookkeeping",$idem]}}}')
          UUID_REGEX='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          OK=0
          ROW_ID=""
          RESP=""
          for attempt in 1 2; do
            RESP=$(curl -sS -m 15 -X POST "https://nova-caelum-ops-production.up.railway.app/mcp" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${OPS_SERVER_TOKEN}" \
              -d "$PAYLOAD" 2>/dev/null || echo "")
            INNER_TEXT=$(printf '%s' "$RESP" | jq -r '.result.content[0].text // empty' 2>/dev/null || echo "")
            if [ -n "$INNER_TEXT" ]; then
              ROW_ID=$(printf '%s' "$INNER_TEXT" | jq -r '.id // empty' 2>/dev/null || echo "")
            else
              ROW_ID=""
            fi
            if printf '%s' "$ROW_ID" | grep -qE "$UUID_REGEX"; then
              OK=1
              break
            fi
            sleep 3
          done
          unset OPS_SERVER_TOKEN
          if [ "$OK" = "1" ]; then
            echo "worklog row recorded (deterministic step, id=${ROW_ID})"
            gh pr edit "$PR" --remove-label worklog-write-failed 2>/dev/null || true
          else
            ERRTEXT=$(printf '%s' "$RESP" | jq -r '.result.content[0].text // .error.message // "no-response"' 2>/dev/null | head -c 120 || echo "unparseable-response")
            echo "::notice::WORKLOG_PENDING ${SUMMARY} | server said: ${ERRTEXT} | idem=${IDEM_TAG}"
            gh label create worklog-write-failed --color D93F0B 2>/dev/null || true
            gh pr edit "$PR" --add-label worklog-write-failed 2>/dev/null || true
          fi

      - name: Telegram notify (review outcome)
        # Single deterministic notify step (2026-07-18, replaces the former
        # "Escalation notice" + "Notify Daniel on failure" pair). Every PR
        # review pings once, in Daniel's template:
        #   [emoji] PR Review #[X]: [Pass/Fail/Escalation]
        #   Summary: [one sentence]
        #
        #   (type-specific content)
        #
        #   > [run link]
        # Content is sourced, never invented: Summary/Escalation-reason come
        # from CHANGE-SUMMARY:/ESCALATION-REASON: markers the model is
        # instructed to emit in its PR comment (step 5 above); Fail content
        # is derived from claude-execution-output.json + case-mapped causes.
        # hook-secret-handling: tokens only in curl args, -sS only, no -v/set -x,
        # no blob-dumping API responses, vars unset after use.
        #
        # Delivery verification (2026-07-18, auditor P0 hardening): "attempted"
        # is not "delivered". curl --fail-with-body makes HTTP 2xx the only exit-0
        # case; we additionally require jq -e '.ok == true' on the response body.
        # 2 retries with backoff (3 attempts total). On exhaustion: label the PR
        # notification-delivery-failed, emit ::error:: with a sanitized detail
        # (ok/error_code/description fields ONLY — never the raw body, never
        # token/chat_id), and exit 1 so the step (and run) goes red. That red step
        # IS the durable failure record; the worklog step above already ran and
        # recorded the review-outcome row, so no signal is lost.
        if: always() && !cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DANIEL_CHAT_ID: ${{ secrets.TELEGRAM_DANIEL_CHAT_ID }}
        run: |
          set -euo pipefail
          PR=${{ github.event.pull_request.number }}
          RUN_LINK="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # --- classify: fail (review step didn't succeed) / escalation (label) / pass ---
          # Layer one: validation-skip (workflow-change PR, model never ran) is
          # escalation-with-specific-reason; the worklog step already labeled it.
          VALIDATION_SKIP=0
          [ -f /home/runner/work/_temp/claude-execution-output.json ] || VALIDATION_SKIP=1
          if [ "${{ steps.review.outcome }}" != "success" ]; then
            TYPE="fail"
          else
            HAS_ESC=$(gh pr view "$PR" --json labels -q '[.labels[].name] | contains(["escalate-daniel"])' 2>/dev/null || echo "false")
            if [ "$HAS_ESC" = "true" ]; then TYPE="escalation"; else TYPE="pass"; fi
          fi

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_DANIEL_CHAT_ID:-}" ]; then
            echo "::notice::TELEGRAM_NOTIFY_SKIPPED telegram secrets unset — PR comment/worklog is the audit trail (type=${TYPE})"
            exit 0
          fi

          # --- Summary line (all types), sourced from the model's CHANGE-SUMMARY marker ---
          COMMENTS=$(gh pr view "$PR" --json comments -q '[.comments[].body] | join("\n---\n")' 2>/dev/null || echo "")
          CHANGE_SUMMARY=$(printf '%s\n' "$COMMENTS" | grep -m1 '^CHANGE-SUMMARY:' | sed 's/^CHANGE-SUMMARY:[[:space:]]*//' || true)
          if [ -z "$CHANGE_SUMMARY" ]; then
            CHANGE_SUMMARY=$(gh pr view "$PR" --json title -q '.title' 2>/dev/null || echo "PR #${PR}")
          fi

          case "$TYPE" in
            pass)
              EMOJI="🟢"; STATUS_WORD="Pass"
              CONTENT="Successful - no issue"
              ;;
            escalation)
              EMOJI="🟡"; STATUS_WORD="Escalation"
              if [ "$VALIDATION_SKIP" = "1" ]; then
                ESCALATION_REASON="This PR changes the reviewer's own workflow definition, so the automated review was skipped entirely — it needs your direct review before merge."
              else
                ESCALATION_REASON=$(printf '%s\n' "$COMMENTS" | grep -m1 '^ESCALATION-REASON:' | sed 's/^ESCALATION-REASON:[[:space:]]*//' || true)
                if [ -z "$ESCALATION_REASON" ]; then
                  ESCALATION_REASON="Touches a protected path — see the review comment on the PR."
                fi
              fi
              CONTENT="$ESCALATION_REASON"
              ;;
            fail)
              EMOJI="🔴"; STATUS_WORD="Fail"
              OUT="/home/runner/work/_temp/claude-execution-output.json"
              if [ ! -f "$OUT" ]; then
                CAUSE="The action never launched Claude (likely a workflow-file change or validation skip)."
                NEXT="Claude to review the workflow file on this pull request."
                RETRY="N"
              else
                ERRTEXT=$(jq -r 'if type=="array" then (.[-1].result // .[-1].error // empty) else (.result // .error // empty) end' "$OUT" 2>/dev/null | head -c 500 || true)
                if printf '%s' "$ERRTEXT" | grep -qi 'error_max_turns'; then
                  CAUSE="Claude hit its turn limit before finishing."
                  NEXT="Claude to raise the turn limit or slim the review task."
                  RETRY="Y"
                elif printf '%s' "$ERRTEXT" | grep -qiE 'credit|billing|401|403|oauth'; then
                  CAUSE="The Anthropic authentication or account balance rejected the run."
                  NEXT="Daniel to check the Claude account/token."
                  RETRY="Y"
                elif [ -n "$ERRTEXT" ]; then
                  CAUSE=$(printf '%s' "$ERRTEXT" | head -c 120)
                  NEXT="Daniel to open the run log."
                  RETRY="N"
                else
                  CAUSE="unknown — no error surfaced"
                  NEXT="Daniel to open the run log."
                  RETRY="N"
                fi
              fi
              CONTENT=$(printf 'Failure Cause: %s\nNext Step: %s\nRetry: %s' "$CAUSE" "$NEXT" "$RETRY")
              ;;
          esac

          TEXT=$(printf '%s PR Review #%s: %s\nSummary: %s\n\n%s\n\n> %s' \
            "$EMOJI" "$PR" "$STATUS_WORD" "$CHANGE_SUMMARY" "$CONTENT" "$RUN_LINK")

          DELIVERED=0
          RESP_BODY=""
          CURL_EXIT=99
          for attempt in 1 2 3; do
            RESP_BODY=$(curl -sS --fail-with-body --max-time 10 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_DANIEL_CHAT_ID}" \
              --data-urlencode "text=${TEXT}" 2>/dev/null) && CURL_EXIT=0 || CURL_EXIT=$?
            if [ "$CURL_EXIT" -eq 0 ] && printf '%s' "$RESP_BODY" | jq -e '.ok == true' >/dev/null 2>&1; then
              DELIVERED=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 2))
            fi
          done

          if [ "$DELIVERED" = "1" ]; then
            echo "telegram notify sent (type=${TYPE})"
            unset TELEGRAM_BOT_TOKEN TELEGRAM_DANIEL_CHAT_ID
          else
            if [ -z "$RESP_BODY" ]; then
              DETAIL="no-response (curl_exit=${CURL_EXIT})"
            else
              DETAIL=$(printf '%s' "$RESP_BODY" | jq -r '"ok=" + ((.ok // "n/a") | tostring) + " error_code=" + ((.error_code // "n/a") | tostring) + " description=" + (.description // "n/a")' 2>/dev/null || echo "unparseable-response (curl_exit=${CURL_EXIT})")
            fi
            gh label create notification-delivery-failed --color B60205 2>/dev/null || true
            gh pr edit "$PR" --add-label notification-delivery-failed || true
            echo "::error::TELEGRAM_DELIVERY_FAILED type=${TYPE} detail=${DETAIL}"
            unset TELEGRAM_BOT_TOKEN TELEGRAM_DANIEL_CHAT_ID
            exit 1
          fi
